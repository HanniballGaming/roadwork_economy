<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f2;background:#10151b;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.layout{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}.side{background:#151d23;border-right:1px solid #2c373d;padding:25px 17px;display:flex;flex-direction:column;gap:23px}.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 14px}.logo{display:grid;place-items:center;background:#f3c243;color:#131719;width:43px;height:43px;border-radius:10px;font-size:25px;font-weight:900;transform:rotate(-4deg)}.brand strong{font-size:18px;letter-spacing:1px}.brand small{display:block;color:#91a0a8;font-size:10px;letter-spacing:2px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{text-align:left;border:0;background:transparent;color:#a9b5ba;padding:13px 15px;border-radius:9px;font-weight:600}.nav button:hover{background:#243036;color:#fff}.nav button.active{background:#423b25;color:#ffd066;border-left:3px solid #ffd066}.side-foot{margin-top:auto;background:#202a31;border:1px solid #344047;border-radius:12px;padding:14px;color:#a7b3ba;line-height:1.7}.side-foot strong{color:#fff}.main{padding:34px clamp(18px,4vw,58px);max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:27px}.eyebrow{color:#e8b83e;letter-spacing:2px;text-transform:uppercase;font-size:11px;font-weight:800}h1{font-size:clamp(25px,3vw,38px);margin:5px 0 7px;letter-spacing:-.7px}h2{font-size:21px;margin:0 0 18px}h3{margin:0 0 8px;font-size:16px}p{color:#a5b4bc;line-height:1.65}.muted,small{color:#8c9ea8}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #475259;padding:11px 16px;border-radius:9px;color:#eff5f6;background:#263139;font-weight:700}.btn:hover{filter:brightness(1.14)}.btn.primary{background:#f2c44f;color:#161a1d;border-color:#f2c44f}.btn.danger{color:#f9aaa4;border-color:#735151;background:#36272a}.btn.small{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel,.job,.item{background:#1b242b;border:1px solid #334048;border-radius:14px;padding:19px}.stat .label{font-size:12px;color:#9caeb7}.value{font-size:clamp(19px,2.1vw,28px);font-weight:800;letter-spacing:-.6px;margin-top:11px;font-variant-numeric:tabular-nums}.green{color:#68d8a0}.yellow{color:#ffd05e}.red{color:#ff908b}.panel{margin-bottom:18px}.hero{background:linear-gradient(115deg,rgba(17,24,28,.80),rgba(19,25,29,.45)),radial-gradient(ellipse at 75% 30%,#796029 0%,transparent 50%),linear-gradient(125deg,#34443d,#1e2b32);border:1px solid #45514c;border-radius:16px;padding:33px;min-height:230px;display:flex;flex-direction:column;justify-content:center;margin-bottom:19px;position:relative;overflow:hidden}.hero:after{content:'▰  ▰  ▰  ▰  ▰  ▰';color:#ddae3f18;position:absolute;font-size:90px;transform:rotate(-25deg);right:-60px;bottom:-65px;pointer-events:none}.hero h2{font-size:30px;max-width:590px;margin:10px 0}.hero p{max-width:580px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid #344048}.line:last-child{border-bottom:0}.pill{font-size:11px;border-radius:99px;background:#3f3725;color:#f3cb69;padding:6px 10px;font-weight:800}.pill.good{background:#213d32;color:#82e3ae}.pill.bad{background:#442c2d;color:#ffaba7}.item{display:flex;flex-direction:column;gap:10px}.item .actions{margin-top:auto}.item p{margin:0}.item .amount{font-size:23px;font-weight:800}.sectionhead{margin:25px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.field{display:grid;gap:7px;margin:12px 0}.field label{color:#a5b4bc;font-weight:600}input,select{padding:11px;border:1px solid #53626a;background:#10191f;color:#fff;border-radius:8px;width:100%}.notice{padding:14px 17px;border-radius:10px;border:1px solid #5c4a29;background:#302a1e;color:#efd79f;margin-bottom:16px;line-height:1.6}.notice.success{border-color:#306048;background:#1d3229;color:#91e2b0}.notice.error{border-color:#815151;background:#402729;color:#ffc3ba}.hidden{display:none!important}.history{display:grid;gap:10px}.entry{border-left:3px solid #d9aa3c;background:#232e35;padding:13px 15px;border-radius:6px;line-height:1.6;color:#c5d1d6}.entry time{font-size:11px;color:#f2c65a;font-weight:700}.chart{display:flex;height:190px;align-items:end;gap:14px;padding:20px 8px 5px;border-bottom:1px solid #526068}.bar{flex:1;min-width:15px;background:linear-gradient(#f5cf68,#af852a);border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);color:#a4b1b9;font-size:11px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #344149}th{color:#96a6ae;font-size:12px}td:last-child,th:last-child{text-align:right}.mobile-nav{display:none}.footer{color:#7e929c;font-size:12px;text-align:center;margin:30px 0 8px}#toast{position:fixed;bottom:22px;right:22px;max-width:370px;padding:15px 20px;border-radius:10px;background:#e9c35c;color:#171d1e;font-weight:700;box-shadow:0 16px 40px #0009;z-index:20;display:none}.choices{display:flex;gap:10px;flex-wrap:wrap}.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:25}.modal{max-width:530px;width:100%;background:#202b32;border:1px solid #5d6b71;border-radius:16px;padding:26px;max-height:90vh;overflow:auto}.modal p{white-space:pre-line}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:740px){.layout{display:block}.side{display:none}.mobile-nav{display:flex;gap:5px;overflow:auto;padding:12px;background:#151d23;border-bottom:1px solid #344047;position:sticky;top:0;z-index:10}.mobile-nav button{flex:none;background:#26313a;border:0;border-radius:9px;color:#d2d9dc;padding:10px 12px;font-size:12px;font-weight:700}.mobile-nav button.active{background:#e9bc4d;color:#171c1d}.main{padding:23px 15px}.grid2,.grid3{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:13px}.hero{min-height:195px;padding:22px}.hero h2{font-size:24px}.value{font-size:19px}}

</head><body>
<div class="layout"><aside class="side"><div class="brand"><span class="logo">R</span><div><strong>ROADWORKS</strong><small>ECONOMY</small></div></div><nav class="nav" id="nav"></nav><div class="side-foot"><strong>🏗️ Dein Unternehmen</strong><div id="sideInfo"></div><div style="margin-top:10px;color:#ffd05e">PLANEN. BAUEN. GESTALTEN.</div></div></aside><div class="mobile-nav" id="mobileNav"></div><main class="main"><div class="top"><div><div class="eyebrow" id="sectionLabel">UNTERNEHMENSLEITUNG</div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="weekLabel"></div></div><div class="row"><button class="btn small" onclick="exportSave()">↓ Spielstand</button><button class="btn small" onclick="document.getElementById('importInput').click()">↑ Laden</button><input class="hidden" id="importInput" type="file" accept=".json,application/json" onchange="importSave(event)"></div></div><div id="stats" class="stats"></div><div id="notice"></div><div id="content"></div><div class="footer">ROADWORKS ECONOMY · Offline spielbare Browser-Demo · Dein Spielstand bleibt lokal auf diesem Gerät.</div></main></div><div id="toast"></div><div id="modalRoot"></div>
<script>
'use strict';
const KEY='roadworks-economy-v1';
const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const machinery=[{id:'truck',name:'Kipper-LKW',price:15000,weekly:0,info:'Kleiner Baustellenkipper für Transportarbeiten.'},{id:'mini',name:'Minibagger',price:12000,weekly:0,info:'Hausanschlüsse und kleinere Erdarbeiten.'},{id:'roller',name:'Tandemwalze',price:35000,weekly:300,info:'Reduziert bei Asphaltarbeiten die Mietkosten.'},{id:'excavator',name:'20-t-Kettenbagger',price:82000,weekly:600,info:'Große Erdarbeiten und Baugruben.'},{id:'loader',name:'Radlader',price:28000,weekly:350,info:'Schüttguttransport und Materiallager.'},{id:'heavytruck',name:'Baustellen-LKW',price:48000,weekly:420,info:'Mehr Transportkapazität.'},{id:'paver',name:'Asphaltfertiger',price:95000,weekly:800,info:'Asphaltflächen ohne Fremdfertiger.'}];
const staff=[{id:'road',name:'Straßenbauer',weekly:850},{id:'machine',name:'Maschinenführer',weekly:1100},{id:'driver',name:'Berufskraftfahrer',weekly:900},{id:'manager',name:'Bauleiter',weekly:1450},{id:'survey',name:'Vermessungstechniker',weekly:1200}];
const yards=[{id:'storage',name:'Materiallager',price:18000,weekly:100,info:'Vergrößert Lagerkapazität.'},{id:'workshop',name:'Werkstatt',price:35000,weekly:250,info:'Reparaturen und Maschinenpflege.'},{id:'office',name:'Büroerweiterung',price:24000,weekly:180,info:'Mehr Verwaltungsfläche.'},{id:'depot',name:'Großer eigener Bauhof',price:110000,weekly:500,info:'Neuer Hauptstandort mit zusätzlichem Platz.'}];
const original=()=>({week:9,cash:214383.66,rep:56,baseCosts:2000,assets:[{id:'truck',value:15000},{id:'mini',value:12000},{id:'roller',value:35000}],staff:[],staffBase:2,yards:[],loans:[{id:1,name:'Betriebsmittelkredit',balance:22216.31,annual:.08,rate:500.63,weeks:46},{id:2,name:'Projektkredit',balance:23155.74,annual:.09,rate:503.14,weeks:48}],history:[{week:0,cash:20000},{week:1,cash:26000},{week:2,cash:12000},{week:3,cash:51499.37},{week:4,cash:69998.74},{week:5,cash:139994.97},{week:6,cash:125991.20},{week:7,cash:169687.43},{week:8,cash:214383.66}],logs:[{week:8,text:'Kreisstraßenprogramm erfolgreich abgeschlossen. Auszahlung: 120.000 €.'},{week:6,text:'Tandemwalze für 35.000 € angeschafft.'},{week:5,text:'Umgehungsstraße abgeschlossen; neuer Projektkredit.'}],nextLoanId:3,notice:'Bisheriger Chat-Spielstand übernommen. Woche 9 ist offen.'});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||original()}catch(e){S=original()};let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function assetsTotal(){return round(S.assets.reduce((a,x)=>a+x.value,0)+S.yards.reduce((a,x)=>a+x.price,0))}function debt(){return round(S.loans.reduce((a,x)=>a+x.balance,0))}function equity(){return round(S.cash+assetsTotal()-debt())}function fixed(){return S.baseCosts+S.assets.reduce((a,x)=>a+(x.fromWeek&&S.week<x.fromWeek?0:(machinery.find(m=>m.id===x.id)?.weekly||0)),0)+S.staff.reduce((a,x)=>a+(x.fromWeek&&S.week<x.fromWeek?0:(staff.find(m=>m.id===(x.id||x))?.weekly||0)),0)+S.yards.reduce((a,x)=>a+(x.fromWeek&&S.week<x.fromWeek?0:x.weekly),0)}function rateTotal(){return round(S.loans.reduce((a,x)=>a+x.rate,0))}function hasMachine(id){return S.assets.some(x=>x.id===id)}function addLog(text){S.logs.unshift({week:S.week,text});S.logs=S.logs.slice(0,80)}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3800)}
function ask(title,message,yesText,fn){document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h2>${esc(title)}</h2><p>${esc(message)}</p><div class="row"><button class="btn primary" id="yesAction">${esc(yesText)}</button><button class="btn" onclick="closeModal()">Abbrechen</button></div></div></div>`;document.getElementById('yesAction').onclick=()=>{closeModal();fn()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function navigate(p){page=p;render();window.scrollTo(0,0)}
const sections=[['dashboard','▦ Übersicht'],['contracts','▤ Aufträge'],['bank','▣ Bank'],['fleet','▰ Fuhrpark'],['staff','♟ Personal'],['yard','▥ Bauhof'],['finance','▤ Finanzen'],['history','◷ Ereignisse'],['settings','⚙ Spielstand']];
function render(){save();document.getElementById('nav').innerHTML=sections.map(([id,name])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${name}</button>`).join('');document.getElementById('mobileNav').innerHTML=sections.map(([id,name])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${name}</button>`).join('');document.getElementById('sideInfo').innerHTML=`Woche ${S.week}<br>${S.staffBase+S.staff.length} Mitarbeiter<br>${S.assets.length} Maschinen und Fahrzeuge<br>Reputation ${S.rep}/100`;
let title={dashboard:'Unternehmensübersicht',contracts:'Auftragsmarkt',bank:'Bank & Darlehen',fleet:'Fuhrpark & Handel',staff:'Personalverwaltung',yard:'Bauhofausbau',finance:'Finanzberichte',history:'Ereignisprotokoll',settings:'Spielstand verwalten'};document.getElementById('pageTitle').textContent=title[page];document.getElementById('weekLabel').textContent=`Woche ${S.week} · Woche noch nicht abgeschlossen`;document.getElementById('sectionLabel').textContent='ROADWORKS ECONOMY · GESCHÄFTSFÜHRUNG';document.getElementById('stats').innerHTML=[['Bankguthaben',money(S.cash),'green'],['Unternehmenswert',money(equity()),''],['Kreditschulden',money(debt()),''],['Reputation',S.rep+' / 100','yellow']].map(([a,b,c])=>`<div class="stat"><div class="label">${a}</div><div class="value ${c}">${b}</div></div>`).join('');document.getElementById('notice').innerHTML=S.notice?`<div class="notice success">${esc(S.notice)}</div>`:'';document.getElementById('content').innerHTML=({dashboard:dashboardPage,contracts:contractsPage,bank:bankPage,fleet:fleetPage,staff:staffPage,yard:yardPage,finance:financePage,history:historyPage,settings:settingsPage}[page])()}
function actions(){return `<button class="btn primary" onclick="navigate('contracts')">Aufträge ansehen</button> <button class="btn" onclick="navigate('bank')">Bank öffnen</button>`}
function dashboardPage(){let recent=S.logs[0];return `<section class="hero"><div class="eyebrow">PLANEN. BAUEN. GESTALTEN.</div><h2>Dein Unternehmen. Deine Entscheidungen.</h2><p>Übernimm Straßenbauprojekte, investiere in Maschinen und entwickle ROADWORKS zu einem regionalen Baukonzern.</p><div class="row">${actions()}</div></section><div class="grid2"><div class="panel"><h2>Geschäftsbetrieb</h2>${[['Aktuelle Woche',S.week],['Mitarbeiter',S.staffBase+S.staff.length],['Fuhrpark',S.assets.length],['Fuhrparkwert',money(S.assets.reduce((a,x)=>a+x.value,0))],['Fixkosten je Woche',money(fixed())],['Kreditraten je Woche',money(rateTotal())]].map(([a,b])=>`<div class="line"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="panel"><h2>Aktuelles Unternehmensziel</h2><div class="value yellow">${Math.min(100,equity()/10000).toFixed(1).replace('.',',')} %</div><p>Erreiche 1.000.000 € Eigenkapital und etabliere ROADWORKS als führendes Bauunternehmen.</p><div style="height:12px;background:#344048;border-radius:20px;overflow:hidden"><div style="height:100%;width:${Math.min(100,equity()/10000)}%;background:#e6b53f"></div></div><h3 style="margin-top:23px">Letzte Meldung</h3><p>${esc(recent?.text||'Das Unternehmen ist betriebsbereit.')}</p></div></div><div class="panel"><h2>Liquiditätsübersicht</h2><div class="line"><span>Bankguthaben</span><strong class="green">${money(S.cash)}</strong></div><div class="line"><span>Regelmäßige Auszahlungen ohne neue Aufträge</span><strong class="red">${money(fixed()+rateTotal())} / Woche</strong></div><div class="line"><span>Eigenkapital</span><strong>${money(equity())}</strong></div></div>`}
function availableJobs(){const w=S.week;let raw=w===9?[{name:'Ortsdurchfahrt erneuern',revenue:105000,cost:61000,risk:10,extra:9000,rep:5},{name:'Gewerbegebiet Süd',revenue:290000,cost:180000,risk:30,extra:40000,rep:11},{name:'Teilstück der Ortsumgehung',revenue:420000,cost:275000,risk:40,extra:55000,rep:14}]:[{name:'Gemeindestraßen sanieren',revenue:round(68000+w*4200),cost:round(36000+w*2100),risk:10,extra:10000,rep:4},{name:'Neubau Gewerbegebiet',revenue:round(175000+w*11000),cost:round(108000+w*7200),risk:25,extra:30000,rep:9},{name:'Umgehungsstraße – Bauabschnitt',revenue:round(260000+w*15000),cost:round(183000+w*9500),risk:35,extra:50000,rep:12}];if(hasMachine('roller'))raw.push({name:'Asphaltdeckschicht – Sonderauftrag',revenue:round(80000+w*3800),cost:round(42000+w*2100),risk:15,extra:13000,rep:6});if(hasMachine('excavator'))raw.push({name:'Großflächige Erdarbeiten',revenue:round(95000+w*5000),cost:round(48000+w*3100),risk:20,extra:17000,rep:7});if(hasMachine('loader'))raw.push({name:'Schüttgut- und Erdbauauftrag',revenue:round(72000+w*3400),cost:round(36000+w*1600),risk:12,extra:12000,rep:5});return raw.map((j,i)=>({...j,id:i+1}))}
function contractsPage(){let j=availableJobs();return `<div class="notice">Wähle einen Auftrag. Alle Angebote gelten für <b>Woche ${S.week}</b>. Kosten für Mietmaschinen und Projektpersonal sind in den angegebenen Projektkosten enthalten. Pro Woche kann ein Hauptauftrag ausgeführt werden.</div><div class="grid2">${j.map(x=>`<article class="item"><div class="row between"><span class="pill ${x.risk<=15?'good':x.risk>=35?'bad':''}">${x.risk} % Projektrisiko</span><span class="muted">Ausschreibung ${x.id}</span></div><h3>${esc(x.name)}</h3><div class="amount green">${money(x.revenue-x.cost-fixed())}</div><small>Operativer Wochengewinn vor Kreditzinsen</small><div class="line"><span>Auftragssumme</span><b>${money(x.revenue)}</b></div><div class="line"><span>Projektkosten</span><b>${money(x.cost)}</b></div><div class="line"><span>Mögliche Mehrkosten</span><b>${money(x.extra)}</b></div><div class="line"><span>Reputation bei Erfolg</span><b>+${x.rep}</b></div><p>${S.cash<x.cost+fixed()+rateTotal()?'⚠️ Zwischenfinanzierung erforderlich.':'Die laufende Liquidität reicht für die reguläre Vorfinanzierung.'}</p><div class="actions"><button class="btn primary" onclick="chooseJob(${x.id})">Auftrag prüfen & starten</button></div></article>`).join('')}</div>`}
function chooseJob(id){let x=availableJobs().find(j=>j.id===id);if(!x)return;let needed=round(x.cost+fixed()+rateTotal()-S.cash);if(needed>0){ask('Finanzierung erforderlich',`Für den Auftrag „${x.name}“ fehlen vor Zahlungseingang mindestens ${money(needed)}. Der Auftrag kann so nicht starten. Beantrage zuerst einen Betriebsmittelkredit oder wähle einen kleineren Auftrag.`,'Zur Bank',()=>navigate('bank'));return}ask('Auftrag verbindlich starten?',`${x.name}\nAuftragssumme: ${money(x.revenue)}\nProjektkosten: ${money(x.cost)}\nFixkosten: ${money(fixed())}\nKreditraten: ${money(rateTotal())}\n${x.risk} % Risiko für ${money(x.extra)} Mehrkosten.\n\nMit dem Abschluss springt das Spiel zu Woche ${S.week+1}.`,'Auftrag starten',()=>executeWeek(x))}
function repayLoans(){let payments=0,interest=0;for(let l of S.loans){let i=round(l.balance*l.annual/52);let payment=Math.min(l.rate,round(l.balance+i));let principal=round(payment-i);l.balance=round(Math.max(0,l.balance-principal));l.weeks=Math.max(0,l.weeks-1);payments+=payment;interest+=i}S.loans=S.loans.filter(l=>l.balance>.005);return {payments:round(payments),interest:round(interest)}}
function executeWeek(job){let start=S.cash,oldDebt=debt(),expense=fixed(),damage=job&&Math.random()*100<job.risk,extra=damage?job.extra:0;const loan=repayLoans(),income=job?job.revenue:0,variable=job?job.cost:0;S.cash=round(S.cash+income-variable-extra-expense-loan.payments);let profit=round(income-variable-extra-expense-loan.interest);if(job)S.rep=Math.min(100,S.rep+(damage?Math.max(1,job.rep-3):job.rep));addLog(job?`${job.name} abgeschlossen. ${damage?'Baugrundproblem! Zusatzkosten '+money(extra)+'.':'Keine zusätzlichen Baukosten.'} Umsatz ${money(income)}, Gewinn nach Zinsen ${money(profit)}.`:`Woche ohne Bauauftrag abgeschlossen. Betriebskosten und Kreditraten wurden bezahlt.`);const summary=`Woche ${S.week} abgeschlossen.\n${job?'Auftrag: '+job.name:'Kein Bauauftrag'}\n${damage?'⚠️ Baugrundproblem: '+money(extra)+' Mehrkosten':'✅ Keine außerplanmäßigen Projektkosten'}\n\nAnfangskontostand: ${money(start)}\nAuftragseinnahmen: +${money(income)}\nProjektkosten: −${money(variable+extra)}\nFixkosten: −${money(expense)}\nKreditraten: −${money(loan.payments)}\nDavon Zinsen: ${money(loan.interest)}\n\nNeuer Kontostand: ${money(S.cash)}\nWochengewinn nach Zinsen: ${money(profit)}\nNeue Restschuld: ${money(debt())}\nEigenkapital: ${money(equity())}`;S.history.push({week:S.week,cash:S.cash});S.week++;S.notice=`Woche ${S.week-1} abgeschlossen. ${job?job.name:'Kein Hauptauftrag'}. Neuer Kontostand: ${money(S.cash)}.`;save();navigate('dashboard');ask('Wochenabrechnung',summary,`Weiter zu Woche ${S.week}`,()=>{})}
function bankPage(){return `<div class="grid2">${S.loans.map(l=>`<div class="panel"><div class="row between"><h3>${esc(l.name)}</h3><span class="pill">${Math.round(l.annual*100)} % p.a.</span></div><div class="value">${money(l.balance)}</div><div class="line"><span>Wochenrate</span><b>${money(l.rate)}</b></div><div class="line"><span>Restlaufzeit</span><b>${l.weeks} Wochen</b></div><button class="btn primary" onclick="prefillRepay(${l.id})">Sondertilgen</button></div>`).join('')||'<div class="panel"><h3>Schuldenfrei!</h3><p>Du hast alle Kredite zurückbezahlt.</p></div>'}</div><div class="grid2"><div class="panel"><h2>Sondertilgung</h2><div class="field"><label>Kredit</label><select id="repayLoan">${S.loans.map(l=>`<option value="${l.id}">${esc(l.name)} · ${money(l.balance)}</option>`).join('')}</select></div><div class="field"><label>Tilgungsbetrag (€)</label><input type="number" id="repayAmount" min="0.01" step="0.01" value="10000"></div><p>Die Restlaufzeit bleibt bestehen; die Wochenrate wird nach einer Sondertilgung neu berechnet. Keine Gebühren.</p><button class="btn primary" ${!S.loans.length?'disabled':''} onclick="repay()">Sondertilgung ausführen</button></div><div class="panel"><h2>Neuen Kredit beantragen</h2><div class="field"><label>Kreditbetrag (€)</label><input id="newCredit" type="number" value="25000" min="1000" max="200000" step="1000"></div><div class="field"><label>Laufzeit</label><select id="loanTerm"><option value="26">26 Wochen · 10 % p.a.</option><option value="52" selected>52 Wochen · 9 % p.a.</option><option value="104">104 Wochen · 11 % p.a.</option></select></div><p>Vereinfachtes Spielbankangebot. Die Bank prüft die gesamte Verschuldung im Verhältnis zum Eigenkapital.</p><button class="btn" onclick="newCredit()">Kredit beantragen</button></div></div>`}
function prefillRepay(id){document.getElementById('repayLoan').value=id;document.getElementById('repayAmount').value=S.loans.find(l=>l.id===id).balance;document.getElementById('repayAmount').focus()}
function repay(){let l=S.loans.find(x=>x.id===Number(document.getElementById('repayLoan').value));let a=round(Number(document.getElementById('repayAmount').value));if(!l||!Number.isFinite(a)||a<=0||a>l.balance||a>S.cash){toast('Ungültiger Betrag oder zu wenig Guthaben.');return}ask('Sondertilgung bestätigen',`${money(a)} auf ${l.name} tilgen? Dein Bankguthaben sinkt, deine Kreditschulden ebenfalls.`,'Tilgen',()=>{S.cash=round(S.cash-a);l.balance=round(l.balance-a);if(l.balance<.005){S.loans=S.loans.filter(x=>x!==l)}else{let r=l.annual/52;l.rate=round(l.balance*r/(1-Math.pow(1+r,-l.weeks)))}addLog(`Sondertilgung ${money(a)} auf ${l.name}.`);S.notice=`Sondertilgung ${money(a)} erfolgreich. Woche ${S.week} bleibt offen.`;render()})}
function newCredit(){let a=Number(document.getElementById('newCredit').value),weeks=Number(document.getElementById('loanTerm').value),annual=weeks===26?.10:weeks===52?.09:.11;if(!Number.isFinite(a)||a<1000||a>200000){toast('Kreditbetrag muss zwischen 1.000 € und 200.000 € liegen.');return}if(debt()+a>Math.max(50000,equity()*1.5)){toast('Bank lehnt ab: Verschuldungsgrenze überschritten.');return}let r=annual/52,rate=round(a*r/(1-Math.pow(1+r,-weeks)));ask('Kreditangebot',`${money(a)} Kredit zu ${(annual*100).toFixed(0)} % p.a. über ${weeks} Wochen. Neue Wochenrate: ${money(rate)}. Annehmen?`,'Kredit aufnehmen',()=>{S.cash=round(S.cash+a);S.loans.push({id:S.nextLoanId++,name:'Unternehmenskredit '+S.nextLoanId,balance:a,annual,rate,weeks});addLog('Neuer Kredit: '+money(a));S.notice='Neuer Kredit ausgezahlt. Woche bleibt geöffnet.';render()})}
function fleetPage(){return `<h2>Dein Fuhrpark</h2><div class="grid3">${S.assets.map((x,i)=>{let m=machinery.find(y=>y.id===x.id);return `<article class="item"><span class="pill good">Einsatzbereit</span><h3>${esc(m?.name||x.id)}</h3><div class="amount">${money(x.value)}</div><small>Vereinfachter Buchwert</small><button class="btn danger actions" onclick="sellMachine(${i})">Fahrzeug verkaufen</button></article>`}).join('')}</div><div class="sectionhead"><h2>Baumaschinenmarkt</h2><span class="muted">Kauf ohne Zeitfortschritt</span></div><div class="grid3">${machinery.map(m=>`<article class="item"><h3>${esc(m.name)}</h3><div class="amount yellow">${money(m.price)}</div><p>${esc(m.info)}</p><small>+${money(m.weekly)}/Woche Betriebskosten ${m.weekly?'ab Folgewoche nach Kauf':'(bereits in Grundkosten enthalten)'}</small><button class="btn primary actions" ${S.cash<m.price?'disabled':''} onclick="buyMachine('${m.id}')">Kaufen</button></article>`).join('')}</div>`}
function buyMachine(id){let m=machinery.find(x=>x.id===id);if(!m||S.cash<m.price)return;ask('Maschine kaufen?',`${m.name} für ${money(m.price)} kaufen? Die Maschine wird mit ihrem Kaufpreis aktiviert. Zusätzliche Fixkosten gelten ab der nächsten Woche.`,'Jetzt kaufen',()=>{S.cash=round(S.cash-m.price);S.assets.push({id,value:m.price,fromWeek:S.week+1});addLog(m.name+' für '+money(m.price)+' angeschafft.');S.notice=`${m.name} gekauft. Keine Woche vergangen.`;render()})}
function sellMachine(i){let a=S.assets[i],m=machinery.find(x=>x.id===a.id);ask('Fahrzeug verkaufen?',`${m?.name||a.id} zum aktuellen Spielbuchwert von ${money(a.value)} verkaufen? Ein Verkauf hebt künftige Wartungskosten auf.`,'Verkaufen',()=>{S.cash=round(S.cash+a.value);S.assets.splice(i,1);addLog((m?.name||a.id)+' für '+money(a.value)+' verkauft.');S.notice='Fahrzeug verkauft. Woche bleibt geöffnet.';render()})}
function staffPage(){return `<div class="panel"><h2>Belegschaft</h2><div class="line"><span>Stammpersonal (im Grundbudget)</span><b>${S.staffBase} Beschäftigte</b></div><div class="line"><span>Zusätzlich Beschäftigte</span><b>${S.staff.length}</b></div><div class="line"><span>Gesamtes Personal</span><b>${S.staffBase+S.staff.length}</b></div><p>Neueinstellungen werden ab der folgenden Spielwoche kostenwirksam. Alle Projektaufträge enthalten die erforderliche befristete Projektbesetzung in ihren Kosten.</p></div><h2>Personalmarkt</h2><div class="grid2">${staff.map(r=>`<article class="item"><h3>${r.name}</h3><div class="amount">${money(r.weekly)}<small> / Woche</small></div><p>Bereits zusätzlich eingestellt: ${S.staff.filter(x=>(x.id||x)===r.id).length}</p><div class="row actions"><button class="btn primary" onclick="hire('${r.id}')">Einstellen</button><button class="btn danger" ${!S.staff.some(x=>(x.id||x)===r.id)?'disabled':''} onclick="fire('${r.id}')">Entlassen</button></div></article>`).join('')}</div>`}
function hire(id){let r=staff.find(x=>x.id===id);ask('Mitarbeiter einstellen?',`${r.name} dauerhaft einstellen? Zusätzliche Kosten: ${money(r.weekly)} je Woche ab Woche ${S.week+1}.`,'Einstellen',()=>{S.staff.push({id,fromWeek:S.week+1});addLog(r.name+' eingestellt.');S.notice=r.name+' eingestellt. Keine Woche vergangen.';render()})}function fire(id){let r=staff.find(x=>x.id===id);ask('Mitarbeiter entlassen?',`${r.name} entlassen? Ab der folgenden Woche entfällt die zusätzliche Wochenvergütung.`, 'Entlassen',()=>{S.staff.splice(S.staff.findIndex(x=>(x.id||x)===id),1);addLog(r.name+' entlassen.');S.notice='Personalbestand angepasst.';render()})}
function yardPage(){return `<div class="panel"><h2>Dein Betriebshof</h2><p>Du verfügst über einen gemieteten Basis-Bauhof mit Stellplatz, Lager und einfachem Büro. Neue Erweiterungen sind als Vermögen bilanziert und erzeugen zusätzliche Betriebskosten.</p>${S.yards.length?S.yards.map(x=>`<div class="line"><span>${esc(x.name)}</span><b>${money(x.price)}</b></div>`).join(''):'<div class="notice">Noch keine Erweiterungen vorhanden.</div>'}</div><h2>Erweiterungen</h2><div class="grid2">${yards.map(y=>`<article class="item"><h3>${y.name}</h3><div class="amount yellow">${money(y.price)}</div><p>${y.info}</p><small>+${money(y.weekly)} / Woche ab Folgewoche</small><button class="btn primary actions" ${S.cash<y.price||S.yards.some(x=>x.id===y.id)?'disabled':''} onclick="buildYard('${y.id}')">${S.yards.some(x=>x.id===y.id)?'Bereits gebaut':'Ausbauen'}</button></article>`).join('')}</div>`}
function buildYard(id){let y=yards.find(x=>x.id===id);ask('Bauhof erweitern?',`${y.name} für ${money(y.price)} errichten?`, 'Erweiterung kaufen',()=>{S.cash=round(S.cash-y.price);S.yards.push({...y,fromWeek:S.week+1});addLog(y.name+' für '+money(y.price)+' gekauft.');S.notice='Bauhof erweitert. Woche bleibt offen.';render()})}
function financePage(){let max=Math.max(...S.history.map(x=>x.cash),S.cash,1);return `<div class="grid2"><div class="panel"><h2>Aktuelle Bilanz</h2>${[['Bankguthaben',money(S.cash)],['Maschinen & Fahrzeuge',money(S.assets.reduce((a,x)=>a+x.value,0))],['Bauhofanlagen',money(S.yards.reduce((a,x)=>a+x.price,0))],['Gesamtvermögen',money(S.cash+assetsTotal())],['Kreditverbindlichkeiten','−'+money(debt())],['Eigenkapital',money(equity())]].map(([a,b])=>`<div class="line"><span>${a}</span><b>${b}</b></div>`).join('')}</div><div class="panel"><h2>Ausgaben pro Woche</h2>${[['Fixkosten ab aktueller Woche',money(fixed())],['Darlehensraten',money(rateTotal())],['Gesamter Mittelabfluss ohne Aufträge',money(fixed()+rateTotal())],['Liquiditätsreichweite ohne Aufträge',((S.cash)/(fixed()+rateTotal()||1)).toFixed(1).replace('.',',')+' Wochen']].map(([a,b])=>`<div class="line"><span>${a}</span><b>${b}</b></div>`).join('')}<p>Tilgungen sind kein Aufwand, reduzieren aber den Kontostand. Die Bilanz verwendet vereinfachte, unveränderte Maschinenbuchwerte.</p></div></div><div class="panel"><h2>Bankguthaben nach Spielwoche</h2><div class="chart">${S.history.slice(-14).map(h=>`<div class="bar" title="Woche ${h.week}: ${money(h.cash)}" style="height:${Math.max(2,h.cash/max*100)}%"><span>${h.week}</span></div>`).join('')}</div><p style="padding-top:17px">Kontostand in Euro. Die aktuelle offene Woche wird erst nach dem Wochenabschluss in die Historie übernommen.</p></div>`}
function historyPage(){return `<div class="panel"><h2>Ereignisse und Geschäftsvorfälle</h2><div class="history">${S.logs.map(l=>`<div class="entry"><time>WOCHE ${l.week}</time><div>${esc(l.text)}</div></div>`).join('')}</div></div>`}
function settingsPage(){return `<div class="panel"><h2>Spielstand speichern & übertragen</h2><p>Der Fortschritt wird automatisch lokal im Browser gespeichert. Wenn du das Spiel auf einem anderen Gerät fortsetzen möchtest, exportiere einen JSON-Spielstand und importiere ihn dort. Ohne Export kann ein Browserdaten-Löschen den Spielstand entfernen.</p><div class="row"><button class="btn primary" onclick="exportSave()">Spielstand herunterladen</button><button class="btn" onclick="document.getElementById('importInput').click()">Spielstand importieren</button></div></div><div class="panel"><h2>Woche abschließen ohne Auftrag</h2><p>Es werden ${money(fixed())} Fixkosten und voraussichtlich ${money(rateTotal())} Kreditraten abgezogen. Der Auftragmarkt wird danach erneuert.</p><button class="btn" onclick="ask('Woche ohne Auftrag abschließen?', 'Du erhältst in dieser Woche keine Auftragseinnahmen, musst aber alle laufenden Kosten und Kreditraten bezahlen.', 'Woche abschließen',()=>executeWeek(null))">Woche ${S.week} abschließen</button></div><div class="panel"><h2>Neues Spiel</h2><p>Dies setzt alle aktuellen Entscheidungen zurück und startet wieder mit dem aus dem Chat übernommenen Stand vor Woche 9. Exportiere den aktuellen Spielstand, wenn du ihn behalten möchtest.</p><button class="btn danger" onclick="ask('Spielstand zurücksetzen?','Alle Änderungen seit dem importierten Stand von Woche 9 werden verworfen.','Zurücksetzen',()=>{S=original();navigate('dashboard')})">Zurücksetzen auf Woche 9</button></div><div class="panel"><h2>Über diese Demo</h2><p>ROADWORKS ECONOMY ist eine lokale, spielbare Wirtschaftssimulation. Sie verwendet vereinfachte Wochenmodelle, Zufallsrisiken, Projekte und Kreditberechnungen. Alle Vermögenswerte werden zunächst zum Kaufpreis geführt; Steuern, Abschreibungen, realistische Projektlaufzeiten, Angebotspreise und Verzögerungen sind noch nicht enthalten.</p></div>`}
function exportSave(){let blob=new Blob([JSON.stringify({app:'roadworks-economy',version:1,data:S},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`roadworks-economy-woche-${S.week}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Spielstand exportiert.')}function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);let d=v.data||v;if(typeof d.week!=='number'||typeof d.cash!=='number'||!Array.isArray(d.loans)||!Array.isArray(d.assets)||!Array.isArray(d.staff)||!Array.isArray(d.yards)||!Array.isArray(d.logs)||!Array.isArray(d.history))throw Error('Invalid');S=d;S.notice='Spielstand erfolgreich importiert.';navigate('dashboard')}catch(err){toast('Diese Datei enthält keinen gültigen Spielstand.')}};r.readAsText(f);e.target.value=''}
render();
</script></body></html>
